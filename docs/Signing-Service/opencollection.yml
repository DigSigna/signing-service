docs:
  content: API REST para firma digital de documentos, multi-tenant. No opera el HSM directamente — delega toda operación criptográfica a hsm-service vía HTTP (RemoteHSMClient), reenviando el JWT del caller original (servicios stateless, sin token de servicio fijo). Consume certificate-service para obtener/validar el certificado del firmante. El OpenAPI de esta página (`/openapi.json`) es importable directamente en Bruno (Import Collection → OpenAPI v3) para generar la colección de requests manuales.
