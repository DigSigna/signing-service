info:
  name: Firmar un documento con un certificado propio
  type: http
  seq: 1
  tags:
    - signing

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sign"
  body:
    type: json
    data: |-
      {
        "certificate_id": "512e916f-804f-4600-935c-094a5b0048a0",
        "document_name": "example.pdf",
        "pin": "193042",
        "document_b64": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
            "session_expires_at": "2026-10-15T19:50:00+00:00",
            "session_token": "9f2c...",
            "signature_b64": "MIIB...",
            "signature_format": "RAW",
            "signature_id": "a1b2c3d4-0000-0000-0000-000000000002",
            "signing_request_id": "a1b2c3d4-0000-0000-0000-000000000001",
            "signing_time": "2026-10-15T19:30:00+00:00"
          }
  - name: 400 Response
    description: ValidationError — document_b64 inválido, o falta pin sin un session_token vigente
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }
  - name: 403 Response
    description: AuthorizationError — el caller debe reenviar el JWT del propio titular del certificado
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }
  - name: 404 Response
    description: NotFoundError — certificate_id no existe o el caller no tiene autoridad para verlo
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }
  - name: 409 Response
    description: SigningPinNotSetError, o DuplicateRequestError si un request con el mismo X-Request-ID ya está en curso
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }
  - name: 422 Response
    description: CertificateChainInvalidError — la cadena del certificado no valida (expirado/revocado/firma rota en algún eslabón)
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }
  - name: 423 Response
    description: SigningPinLockedError — demasiados intentos fallidos
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 423
      statusText: Locked
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }
  - name: 502 Response
    description: CertificateServiceUnavailableError, SigningPinVerificationUnavailableError, o HsmError
    request:
      url: "{{baseUrl}}/api/v1/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "certificate_id": "eb6dc1bc-74e9-43cd-9b0c-e47e36d6f7bd",
            "document_b64": "JVBERi0xLjQK...",
            "document_name": "contrato.pdf",
            "pin": "193042"
          }
    response:
      status: 502
      statusText: Bad Gateway
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": "",
              "details": {}
            }
          }

docs: Hashea el documento, obtiene y valida la cadena del certificado vía certificate-service, resuelve el signing PIN (PIN nuevo o session_token vigente — ADR-005) y pide a hsm-service que firme. signature_format es siempre RAW hoy (sin empaquetado PKCS#7/CMS todavía). Devuelve session_token/session_expires_at para evitar re-pedir el PIN en la próxima firma dentro de la ventana de gracia.
