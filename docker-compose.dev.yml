version: '3.8'

# Requiere que el stack de hsm-service ya esté corriendo primero:
#   cd ../hsm-service && make dev-up   (o make up, según su Makefile)
# Ese compose crea la red externa "hsm-network" y el servicio "mysql"
# (esquema compartido "digsigna", aplicado por su contenedor "migrate")
# que este servicio consume. No levanta su propia base de datos: signing-service,
# certificate-service y hsm-service comparten la misma instancia MySQL para
# evitar esquemas divergentes. Si necesitás correr signing-service sin
# depender de hsm-service, usá `make infra-up` (docker-compose.yml) +
# HSM_BACKEND=in_memory.

services:
  signing-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - digsigna_common_token
    image: signing-service:dev
    container_name: signing-service-dev
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CONFIG_FILE: /app/config/config.yaml

      # Esquema MySQL compartido con hsm-service (ver nota arriba)
      DB_URL: "mysql://digsigna:digsigna@mysql:3306/digsigna"

      # Auth: JWKS real de identification-service en vez de la llave pública
      # local (antes montada desde ./keys) -- mismo razonamiento que
      # hsm-service/certificate-service, ver sus respectivos
      # docker-compose.dev.yml. AUTH_ISSUER/AUTH_AUDIENCE fijados para
      # igualar el chequeo que hsm-service ya hardcodea
      # (identification-service emite iss="identification-service", aud
      # incluye "signing-service", ver signer.js). Requiere
      # identification-service corriendo (cd ../identification-service &&
      # make dev-up) antes de este servicio: la carga inicial de llaves
      # hace fetch de JWKS al boot en modo production, sin fallback a una
      # llave local si falla.
      AUTH_MODE: production
      AUTH_JWKS_URL: "http://identification-service:3000/.well-known/jwks.json"
      AUTH_ISSUER: identification-service
      AUTH_AUDIENCE: signing-service
      AUTH_TOKEN_CACHE_ENABLED: "false"

      # HSM real vía hsm-service (nombre de servicio en hsm-network, puerto interno del contenedor)
      HSM_BACKEND: remote
      HSM_SERVICE_BASE_URL: "http://hsm-service:8080"
      HSM_SERVICE_TIMEOUT: 5s

      # certificate-service (verify-pin + get/validate certificado, ADR-005) —
      # mismo patrón que HSM_SERVICE_BASE_URL: nombre de servicio en hsm-network,
      # puerto interno del contenedor (8000, no el 8001 publicado al host de ESTE
      # servicio). Sin esto, /sign falla con "Certificate client not initialized"
      # (ver app/main.py: el cliente solo se construye si esto no está vacío).
      CERTIFICATE_SERVICE_BASE_URL: "http://certificate-service:8000"
      CERTIFICATE_SERVICE_TIMEOUT: 5s

      # Auditoría: hybrid cae a solo-DB si no hay AUDIT_HTTP_BASE_URL (ver py_common.audit.factory, en py-common)
      AUDIT_ENABLED: "true"
      AUDIT_STRATEGY: hybrid
    # on-failure: KeyManagerAdapter hace fetch de JWKS al boot -- en un cold
    # start, identification-service puede no estar arriba todavía. Docker
    # reintenta con backoff creciente hasta que responda, en vez de quedar
    # "Exited" esperando un restart manual.
    restart: on-failure
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./keys:/app/keys:ro
    networks:
      - hsm-network
    mem_limit: 96m

networks:
  hsm-network:
    external: true
    name: hsm-network

secrets:
  digsigna_common_token:
    environment: DIGSIGNA_COMMON_TOKEN
