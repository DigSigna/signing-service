name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    name: Format, Lint, Security, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      # DIGSIGNA_COMMON_TOKEN: fine-grained PAT with read access to the
      # private github.com/DigSigna/py-common repo — requirements/base.txt
      # pulls it as a git+https dependency and expands ${DIGSIGNA_COMMON_TOKEN}
      # itself (pip supports env var expansion in requirements files).
      - name: Install dependencies
        env:
          DIGSIGNA_COMMON_TOKEN: ${{ secrets.DIGSIGNA_COMMON_TOKEN }}
        run: pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Format check (black)
        run: black --check app/ tests/

      # max-line-length=88 (matches black) and the E203 black/flake8
      # conflict are configured in setup.cfg, not repeated here.
      - name: Lint (flake8)
        run: flake8 app/ tests/

      # Verified locally: 0 issues, 6113+ lines scanned.
      - name: Security scan (bandit)
        run: bandit -r app/

      # Informational only, not a merge-blocking gate yet: as of this
      # writing it finds real CVEs in fastapi/pyjwt/requests/asyncmy/
      # python-multipart that need a planned, tested upgrade (several are
      # framework-level and could need code changes beyond a version bump)
      # rather than being fixed as a side effect of setting up CI.
      - name: Dependency vulnerability scan (safety, informational)
        run: safety check -r requirements/base.txt || true

      # No real MySQL service needed here: app/infrastructure/database/
      # session.py builds the SQLAlchemy engine eagerly at import time
      # (create_async_engine() itself is lazy, no socket opened), so
      # `app.main` can't even be imported without DB_URL set to *something*
      # syntactically valid — but nothing in this test suite opens a real
      # connection (the HSM layer and repositories are always mocked, per
      # CLAUDE.md). This value is never reachable and never used to
      # connect; it only satisfies Settings.ensure_database_config().
      - name: Test
        env:
          DB_URL: mysql://ci:ci@localhost:3306/ci_test
        run: pytest -v --cov=app --cov-report=term-missing

  publish:
    name: Build & Publish Docker Image
    needs: quality
    # Only publish on a real push to main — never on pull_request (a PR,
    # especially from a fork, shouldn't trigger a push to GHCR with these
    # secrets), and only after the quality gate above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set version
      id: vars
      run: |
        VERSION=1.0.${{ github.run_number }}
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build Docker Image
      env:
        DIGSIGNA_COMMON_TOKEN: ${{ secrets.DIGSIGNA_COMMON_TOKEN }}
      run: |
        docker build --secret id=digsigna_common_token,env=DIGSIGNA_COMMON_TOKEN -t ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.version }} -f Dockerfile .
        docker tag ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.version }} ghcr.io/${{ steps.vars.outputs.repo_lower }}:latest

    - name: Push to GHCR
      run: |
        docker push ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.version }}
        docker push ghcr.io/${{ steps.vars.outputs.repo_lower }}:latest

  deploy:
    name: Deploy to DOKS
    needs: publish
    # Same gate as publish: only a real push to main, never a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: DigSigna/platform-infra/.github/workflows/deploy.yml@main
    with:
      service: signing-service
      tag: 1.0.${{ github.run_number }}
    secrets: inherit