[flake8]
max-line-length = 88
extend-ignore = E203

[tool:pytest]
# Without this, `app` isn't importable when pytest is invoked as the bare
# `pytest` console script (no conftest.py/tests/__init__.py to make pytest's
# rootdir-detection add the repo root to sys.path on its own) — only masked
# locally because `python -m pytest` always prepends cwd regardless of this
# setting. CI invokes the bare script, where it isn't masked.
pythonpath = .
